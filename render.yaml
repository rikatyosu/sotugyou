services:
  - type: web
    name: car-garage
    env: ruby
    plan: free
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec rails server"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: car-garage-db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false

databases:
  - name: car-garage-db
    plan: free
